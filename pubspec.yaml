name: sanad
description: "SANAD - سند | نظام إدارة مخازن Offline لجهاز SUNMI L2s Pro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  excel: ^4.0.6
  file_picker: ^8.3.7
  pdf: ^3.11.1
  printing: ^5.14.2
  open_filex: ^4.7.0
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  uuid: ^4.5.1
  archive: ^3.6.1
  collection: ^1.19.0
  dart_smb2: ^0.1.3
  supabase_flutter: ^2.18.3
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.2
  sunmi_scanner: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/sanad_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#184E77"
  adaptive_icon_foreground: "assets/icons/sanad_icon.png"
